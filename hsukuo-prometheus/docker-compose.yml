services:
  prometheus:
    image: prom/prometheus:v3.15.1@sha256:d445d1806b38f85b5c394a1b87f94113fde0473b45245922c2e8b1bd41fa68ae
    restart: unless-stopped
    user: '1000:1000'
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--storage.tsdb.retention.time=365d'
      - '--web.enable-lifecycle'
      - '--web.enable-admin-api'
      - '--web.listen-address=:9090'
    ports:
      - 19090:9090
    volumes:
      - ${APP_DATA_DIR}/config/prometheus.yml:/etc/prometheus/prometheus.yml
      - ${APP_DATA_DIR}/data:/prometheus