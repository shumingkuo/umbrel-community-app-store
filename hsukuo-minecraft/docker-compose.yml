services:
  server:
    image: itzg/minecraft-server:java25@sha256:e02138323fb1bd9bac652db8add563deb109cfb36c363cdbc948bdaf0a33df00
    restart: on-failure
    user: '1000:1000'
    environment:
      EULA: "TRUE"
      TYPE: "PAPER"
      VERSION: "26.3"
      SEED: "-5448382977646654394"
      RCON_CMDS_STARTUP:  |-
        /gamerule mobGriefing false
        /gamerule keepInventory true
      PLUGINS: |
        https://download.geysermc.org/v2/projects/geyser/versions/latest/builds/latest/downloads/spigot
        https://download.geysermc.org/v2/projects/floodgate/versions/latest/builds/latest/downloads/spigot
        https://github.com/ViaVersion/ViaVersion/releases/download/5.12.1/ViaVersion-5.12.1.jar
    ports:
      - 35565:25565
      - 29132:19132/udp
    volumes:
      - ${APP_DATA_DIR}/data:/data
    stdin_open: true
    tty: true
