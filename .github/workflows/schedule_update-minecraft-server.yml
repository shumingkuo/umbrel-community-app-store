name: schedule_update-minecraft-server
run-name: '[Schedule] Update Minecraft Server'

on:
  workflow_call:
  schedule:
    - cron: '0 7 * * 1'
      timezone: "Asia/Taipei"

permissions:
  contents: write
  pull-requests: write

jobs:
  main:
    uses: ./.github/workflows/main.yml
    secrets: inherit
