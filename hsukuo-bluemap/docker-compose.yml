services:
  server:
    image: ghcr.io/bluemap-minecraft/bluemap:v5.23@sha256:c29b2e34edae760c90a8498aff7029540fa27a825175ae89c5899e47a0994e69
    restart: on-failure
    user: '1000:1000'
    command: -r -u -w
    ports:
      - 18100:8100
    volumes:
      - ${APP_DATA_DIR}/config:/app/config
      - ${APP_DATA_DIR}/data:/app/data
      - ${APP_DATA_DIR}/web:/app/web
      - ${UMBREL_ROOT}/app-data/hsukuo-minecraft/data/world:/app/world
      # - ${UMBREL_ROOT}/app-data/hsukuo-minecraft/data/world_nether:/app/world_nether
      # - ${UMBREL_ROOT}/app-data/hsukuo-minecraft/data/world_the_end:/app/world_the_end