version: "2026.8.10"
tagline: Run a Minecraft server and play with friends anytime, anywhere.
icon: https://raw.githubusercontent.com/shumingkuo/umbrel-community-app-store/main/hsukuo-minecraft/logo.svg
description: >-
  Minecraft is a popular sandbox game that lets players build and explore infinite worlds.


  With this Umbrel app, you can host your own dedicated Minecraft server,

  allowing you and your friends to play together in a persistent world.


  This server is based on the popular Itzg Docker Minecraft Server,

  providing a flexible and easily configurable experience.


  Supports multiple Minecraft versions, plugins, and mods to enhance your gameplay.

